<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shalaka Padalkar — Backend Software Engineer</title>
    <meta name="description" content="Shalaka Padalkar is a backend software engineer building APIs, microservices and data pipelines with Java, Python, TypeScript, Spring Boot, FastAPI, NestJS, PostgreSQL and Redis." />
    <meta name="author" content="Shalaka Padalkar" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />

    <!-- Open Graph: once hosted, make og:image an absolute URL (https://your-domain/profile.jpg) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shalaka Padalkar — Backend Software Engineer" />
    <meta property="og:description" content="APIs, microservices and data pipelines built for reliability and low latency." />
    <meta property="og:image" content="/profile.jpg" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui">
        Shalaka Padalkar, Backend Software Engineer. Find me on LinkedIn:
        https://www.linkedin.com/in/shalaka-padalkar. Please enable JavaScript to view the full portfolio.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
